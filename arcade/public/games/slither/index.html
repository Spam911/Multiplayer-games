<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Slither</title>
<link rel="stylesheet" href="/account.css">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1a;color:#fff;font-family:system-ui,sans-serif;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,8,16,.78)}
  #menu h1{margin:0;font-size:56px;letter-spacing:3px}
  #menu p{margin:0;opacity:.8;min-height:1.2em}
  #menu input{padding:12px 16px;font-size:18px;border-radius:10px;border:2px solid #2c3a5c;background:#101830;color:#fff;width:240px;text-align:center;outline:none}
  #menu button{padding:12px 36px;font-size:18px;font-weight:700;border:0;border-radius:10px;background:#30d158;color:#04210d;cursor:pointer}
  #menu #acctBtn{padding:8px 18px;font-size:14px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);color:#fff;font-weight:600}
  #menu input:disabled{cursor:default}
  #lb{position:fixed;top:12px;right:12px;min-width:170px;padding:10px 12px;background:rgba(0,0,0,.4);border-radius:10px;font-size:13px;line-height:1.5}
  #lb b{display:block;margin-bottom:4px}
  #lb div{display:flex;justify-content:space-between;gap:12px}
  #score{position:fixed;left:14px;top:12px;font-size:20px;font-weight:700}
  #boost{position:fixed;width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.3);display:none;align-items:center;justify-content:center;font-weight:700;user-select:none;-webkit-user-select:none;touch-action:none}
  #boost.on{background:rgba(255,200,60,.55)}
  #joy{position:fixed;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);display:none;touch-action:none;user-select:none;-webkit-user-select:none}
  #knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.45);pointer-events:none}
  /* corner anchors for the touch controls */
  .c-bl{left:24px;bottom:34px}.c-br{right:24px;bottom:28px}
  .c-tl{left:24px;top:56px}.c-tr{right:24px;top:56px}

  /* ---- settings panel ---- */
  #gear{position:fixed;top:44px;left:14px;width:36px;height:36px;border-radius:10px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.4);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
  #home{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:4;padding:6px 14px;border-radius:99px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.18);color:#cfe0ff;text-decoration:none;font-size:13px}
  #home:hover{border-color:#30d158;color:#fff}
  #panel{position:fixed;top:88px;left:14px;width:214px;padding:12px;border-radius:12px;background:rgba(10,15,28,.94);border:2px solid #2c3a5c;z-index:6;display:flex;flex-direction:column;gap:11px;font-size:13px}
  #panel[hidden]{display:none}
  #panel .row{display:flex;flex-direction:column;gap:6px}
  #panel .hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:1px}
  #panel .val{font-weight:400;opacity:.75;font-variant-numeric:tabular-nums}
  #panel input[type=range]{width:100%;accent-color:#30d158}
  #panel .corners{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  #panel .corners button{padding:7px 0;border-radius:7px;border:2px solid #2c3a5c;background:#101830;color:#fff;font-size:14px;cursor:pointer}
  #panel .corners button.sel{background:#30d158;color:#04210d;border-color:#30d158}
  #panel .hint{opacity:.65;line-height:1.4}
  #panel .tgl{display:flex;justify-content:space-between;align-items:center;gap:8px}
  #panel .tgl button{flex:1;padding:6px 0;border-radius:7px;border:2px solid #2c3a5c;background:#101830;color:#fff;cursor:pointer;font-size:12px}
  #panel .tgl button.sel{background:#30d158;color:#04210d;border-color:#30d158}
  #panel .close{padding:8px 0;border-radius:8px;border:0;background:#2c3a5c;color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="home" href="/" title="Back to the lobby">← Lobby</a>
<div id="lb"><b>Leaderboard</b><span id="lbl"></span></div>
<div id="score"></div>
<div id="joy"><div id="knob"></div></div>
<div id="boost">BOOST</div>
<button id="gear" title="Controls &amp; sensitivity" aria-label="Controls">⚙</button>
<div id="panel" hidden>
  <div class="hd"><span>CONTROLS</span><span class="val" id="sensVal">1.0×</span></div>
  <div class="row">
    <label for="sens">Joystick sensitivity</label>
    <input id="sens" type="range" min="0.4" max="2" step="0.1">
    <span class="hint">Lower = smoother and heavier, higher = quicker to respond.</span>
  </div>
  <div class="tgl">
    <span>Show touch controls</span>
    <button id="tOn">Auto</button>
  </div>
  <div class="row">
    <span>Joystick corner</span>
    <div class="corners" id="posJoy">
      <button data-p="c-tl" title="Top left">◤</button>
      <button data-p="c-tr" title="Top right">◥</button>
      <button data-p="c-bl" title="Bottom left">◣</button>
      <button data-p="c-br" title="Bottom right">◢</button>
    </div>
  </div>
  <div class="row">
    <span>Boost button corner</span>
    <div class="corners" id="posBoost">
      <button data-p="c-tl" title="Top left">◤</button>
      <button data-p="c-tr" title="Top right">◥</button>
      <button data-p="c-bl" title="Bottom left">◣</button>
      <button data-p="c-br" title="Bottom right">◢</button>
    </div>
  </div>
  <button class="close" id="panelClose">Done</button>
</div>
<div id="menu">
  <h1>SLITHER</h1>
  <p id="msg">Mouse to steer · click or Space to boost</p>
  <input id="name" maxlength="16" placeholder="Nickname" autocomplete="off">
  <button id="play">Play</button>
  <p id="acctLine" style="font-size:13px;opacity:.75;margin-top:2px"></p>
  <button id="acctBtn" class="acct-chip" style="margin-top:4px">👤 Sign in</button>
</div>
<script src="/account.js"></script>
<script src="/account-ui.js"></script>
<script>
const acctDialog = AccountUI.mount({ onChange() { location.reload(); } });
</script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W, H, dpr;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let ws, world = 4000, vx = 1200, vy = 800, myId = null, playing = false;
const snakes = new Map();
let food = [];
let camX = 2000, camY = 2000, scale = 1;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/slither`);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.t === 'init') { world = m.world; vx = m.vx; vy = m.vy; }
    else if (m.t === 'joined') {
      myId = m.id; playing = true; snakes.clear();
      $('menu').style.display = 'none';
    }
    else if (m.t === 's') applySnapshot(m);
    else if (m.t === 'dead') {
      playing = false;
      const place = m.rank ? ` — place ${m.rank}` : '';
      $('msg').textContent = `You died — score ${m.score}${place}`;
      $('menu').style.display = 'flex';
      if (m.reward) {
        Account.rewardToast(m.reward);
        Account.load().then(paintAccount);
      }
    }
    else if (m.t === 'full') $('msg').textContent = 'Server is full, try again in a moment';
  };
  ws.onclose = () => {
    playing = false;
    $('msg').textContent = 'Disconnected, reconnecting…';
    $('menu').style.display = 'flex';
    setTimeout(connect, 1500);
  };
}
connect();

function applySnapshot(m) {
  const seen = new Set();
  for (const s of m.sn) {
    seen.add(s.i);
    let o = snakes.get(s.i);
    if (!o) { o = { id: s.i, disp: s.s.slice() }; snakes.set(s.i, o); }
    o.n = s.n; o.h = s.h; o.r = s.r; o.b = s.b; o.sc = s.sc; o.tgt = s.s;
    const L = s.s.length;
    if (o.disp.length < L) for (let i = o.disp.length; i < L; i++) o.disp.push(s.s[i]);
    else o.disp.length = L;
  }
  for (const id of [...snakes.keys()]) if (!seen.has(id)) snakes.delete(id);
  food = m.f;
  $('lbl').innerHTML = m.lb.map(e => `<div><span>${e[0]}</span><span>${e[1]}</span></div>`).join('');
  const me = snakes.get(myId);
  if (me) $('score').textContent = me.sc;
}

// ----- settings (joystick feel + where the touch controls sit) -----
const DEFAULTS = { sens: 1, touch: 'auto', joy: 'c-br', boost: 'c-bl' };
let cfg = { ...DEFAULTS };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('slither-cfg') || '{}')); } catch {}
// Accounts keep their control settings between browsers.
if (Account.user && Account.user.settings && Account.user.settings.slitherCfg)
  Object.assign(cfg, Account.user.settings.slitherCfg);

const coarse = matchMedia('(pointer: coarse)').matches;
let useTouch = cfg.touch === 'on' || (cfg.touch === 'auto' && coarse);
let joyRaw = 0, joyAngle = 0;

const saveCfg = () => {
  localStorage.setItem('slither-cfg', JSON.stringify(cfg));
  Account.saveSetting('slitherCfg', cfg);          // no-op for guests
};

function place(el, pos) {
  el.classList.remove('c-tl', 'c-tr', 'c-bl', 'c-br');
  el.classList.add(pos);
}
function syncCornerBtns() {
  for (const [id, key] of [['posJoy', 'joy'], ['posBoost', 'boost']]) {
    for (const b of $(id).children) b.classList.toggle('sel', b.dataset.p === cfg[key]);
  }
}
function applyCfg() {
  place($('joy'), cfg.joy);
  place($('boost'), cfg.boost);
  $('sens').value = cfg.sens;
  $('sensVal').textContent = (+cfg.sens).toFixed(1) + '×';
  $('tOn').textContent = { auto: 'Auto', on: 'On', off: 'Off' }[cfg.touch];
  $('tOn').classList.toggle('sel', cfg.touch !== 'auto');
  $('joy').style.display = useTouch ? 'block' : 'none';
  $('boost').style.display = useTouch ? 'flex' : 'none';
  $('msg').textContent = useTouch
    ? 'Joystick to steer · hold BOOST to speed up'
    : 'Mouse to steer · click or Space to boost';
  syncCornerBtns();
}
$('tOn').addEventListener('click', () => {
  const order = ['auto', 'on', 'off'];
  cfg.touch = order[(order.indexOf(cfg.touch) + 1) % 3];
  useTouch = cfg.touch === 'on' || (cfg.touch === 'auto' && coarse);
  saveCfg(); applyCfg();
});
$('sens').addEventListener('input', e => {
  cfg.sens = +e.target.value;
  $('sensVal').textContent = cfg.sens.toFixed(1) + '×';
  saveCfg();
});
for (const [id, key] of [['posJoy', 'joy'], ['posBoost', 'boost']]) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    cfg[key] = b.dataset.p;
    saveCfg(); applyCfg();
  });
}
$('gear').addEventListener('click', () => { $('panel').hidden = !$('panel').hidden; });
$('panelClose').addEventListener('click', () => { $('panel').hidden = true; });
applyCfg();

// ----- input -----
let mx = 0, my = 0, boost = false;

function bindDesktop() {
  addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  addEventListener('mousedown', () => boost = true);
  addEventListener('mouseup', () => boost = false);
  addEventListener('keydown', e => { if (e.code === 'Space') boost = true; });
  addEventListener('keyup', e => { if (e.code === 'Space') boost = false; });
}
function bindTouch() {
  const joy = $('joy'), knob = $('knob'), bb = $('boost');
  const R = 50;
  let active = null;
  const setKnob = e => {
    const r = joy.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy);
    // dead zone tightens as sensitivity goes up, so a light touch still steers
    if (d > 10 / cfg.sens) joyRaw = Math.atan2(dy, dx);
    const k = d > R ? R / d : 1;
    knob.style.transform = `translate(${dx * k}px,${dy * k}px)`;
  };
  joy.addEventListener('pointerdown', e => {
    e.preventDefault(); active = e.pointerId; joy.setPointerCapture(e.pointerId); setKnob(e);
  });
  joy.addEventListener('pointermove', e => { if (e.pointerId === active) setKnob(e); });
  const endJoy = e => { if (e.pointerId === active) { active = null; knob.style.transform = 'translate(0,0)'; } };
  joy.addEventListener('pointerup', endJoy);
  joy.addEventListener('pointercancel', endJoy);

  bb.addEventListener('pointerdown', e => { e.preventDefault(); bb.setPointerCapture(e.pointerId); boost = true; bb.classList.add('on'); });
  const endBoost = () => { boost = false; bb.classList.remove('on'); };
  bb.addEventListener('pointerup', endBoost);
  bb.addEventListener('pointercancel', endBoost);
}
bindDesktop();
bindTouch();   // always bound, so toggling touch controls on works live

const wrapAng = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
setInterval(() => {
  if (!playing || ws.readyState !== 1) return;
  let a;
  if (useTouch) {
    // ease toward the stick angle: sensitivity is how fast it follows your thumb
    const k = 1 - Math.exp(-(33 / 1000) * 16 * cfg.sens);
    joyAngle = wrapAng(joyAngle + wrapAng(joyRaw - joyAngle) * k);
    a = joyAngle;
  } else {
    a = Math.atan2(my - H / 2, mx - W / 2);
  }
  ws.send(JSON.stringify({ t: 'in', a: +a.toFixed(3), b: boost ? 1 : 0 }));
}, 33);

// ----- menu -----
// Guest nickname, or the account name when signed in.
function paintAccount() {
  const signedIn = !!Account.user;
  $('name').disabled = signedIn;
  $('name').style.opacity = signedIn ? '.6' : '';
  $('name').placeholder = signedIn ? 'Playing as ' + Account.user.name : 'Nickname';
  $('acctLine').textContent = signedIn
    ? `${Account.user.name} · level ${Account.user.level} · ⛁ ${Account.user.tokens}`
    : '';
  $('acctBtn').textContent = signedIn ? `👤 ${Account.user.name}` : '👤 Sign in';
}
function play() {
  if (ws.readyState !== 1) return;
  const n = Account.nickname($('name').value);
  if (!Account.user) localStorage.setItem('slither-name', n);
  ws.send(JSON.stringify({ t: 'join', name: n }));
}
$('play').onclick = play;
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') play(); });

Account.load().then(() => {
  $('name').value = Account.user ? Account.user.name : (localStorage.getItem('slither-name') || '');
  paintAccount();
});
$('acctBtn').onclick = () => Account.user
  ? Account.logout().then(() => location.reload())
  : acctDialog.open('login');

// ----- render -----
function drawSnake(o, isMe) {
  const d = o.disp, n = d.length / 2, r = o.r;
  if (o.b) { ctx.shadowColor = `hsl(${o.h},100%,60%)`; ctx.shadowBlur = 18; }
  for (let i = n - 1; i >= 0; i--) {
    ctx.fillStyle = `hsl(${o.h},80%,${i % 6 < 3 ? 56 : 47}%)`;
    ctx.beginPath(); ctx.arc(d[i * 2], d[i * 2 + 1], r, 0, 6.2832); ctx.fill();
  }
  ctx.shadowBlur = 0;
  const hx = d[0], hy = d[1];
  const ang = n > 1 ? Math.atan2(hy - d[3], hx - d[2]) : 0;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  for (const side of [-1, 1]) {
    const ex = hx + ca * r * 0.45 - sa * r * 0.55 * side;
    const ey = hy + sa * r * 0.45 + ca * r * 0.55 * side;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, r * 0.42, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ex + ca * r * 0.15, ey + sa * r * 0.15, r * 0.2, 0, 6.2832); ctx.fill();
  }
  ctx.fillStyle = isMe ? '#fff' : 'rgba(255,255,255,.75)';
  ctx.font = `${13 / scale}px system-ui`;
  ctx.textAlign = 'center';
  ctx.fillText(o.n, hx, hy - r - 8 / scale);
}

function draw() {
  ctx.fillStyle = '#0b0f1a'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(scale, scale); ctx.translate(-camX, -camY);

  const g = 100, hw = W / 2 / scale, hh = H / 2 / scale;
  ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1 / scale;
  ctx.beginPath();
  for (let x = Math.max(0, Math.floor((camX - hw) / g) * g); x <= Math.min(world, camX + hw); x += g) { ctx.moveTo(x, Math.max(0, camY - hh)); ctx.lineTo(x, Math.min(world, camY + hh)); }
  for (let y = Math.max(0, Math.floor((camY - hh) / g) * g); y <= Math.min(world, camY + hh); y += g) { ctx.moveTo(Math.max(0, camX - hw), y); ctx.lineTo(Math.min(world, camX + hw), y); }
  ctx.stroke();
  ctx.strokeStyle = '#ff4466'; ctx.lineWidth = 6; ctx.strokeRect(0, 0, world, world);

  for (let i = 0; i < food.length; i += 4) {
    ctx.fillStyle = `hsl(${food[i + 2]},90%,60%)`;
    ctx.beginPath(); ctx.arc(food[i], food[i + 1], food[i + 3], 0, 6.2832); ctx.fill();
  }
  for (const o of snakes.values()) if (o.id !== myId) drawSnake(o, false);
  const me = snakes.get(myId);
  if (me) drawSnake(me, true);
  ctx.restore();
}

let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const k = 1 - Math.exp(-dt * 18);
  for (const o of snakes.values())
    for (let i = 0; i < o.disp.length; i++) o.disp[i] += (o.tgt[i] - o.disp[i]) * k;

  const me = snakes.get(myId);
  const fit = Math.max(W / (2 * vx), H / (2 * vy));
  if (me) {
    camX = me.disp[0]; camY = me.disp[1];
    const target = Math.max(fit, 1 - (me.r - 7) * 0.03);
    scale += (target - scale) * 0.05;
  } else scale += (Math.max(fit, 0.8) - scale) * 0.05;
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
